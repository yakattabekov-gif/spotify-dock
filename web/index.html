<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Spotify Dock</title>
<style>
:root {
  --accent: #1ed760;
  --fg: #ffffff;
  --fg2: rgba(255,255,255,.66);
  --fg3: rgba(255,255,255,.32);
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg);
  font-family: -apple-system, system-ui, Roboto, "Segoe UI", sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

.bgl { position: fixed; inset: -12%; background: #181818 center / cover no-repeat; filter: blur(70px) saturate(1.5) brightness(.42); opacity: 0; transition: opacity 1.1s ease; }
.bgl.on { opacity: 1; }
#shade { position: fixed; inset: 0; background: linear-gradient(160deg, transparent 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.6) 100%); }

#app {
  position: fixed; inset: 0; display: flex; gap: 5vmin;
  padding: max(4.5vmin, env(safe-area-inset-top)) max(5vmin, env(safe-area-inset-right)) max(4.5vmin, env(safe-area-inset-bottom)) max(5vmin, env(safe-area-inset-left));
}
.left { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 3.2vmin; min-width: 0; }
.art { position: relative; aspect-ratio: 1; border-radius: 2vmin; overflow: hidden; background: rgba(255,255,255,.06); box-shadow: 0 2.5vmin 7vmin rgba(0,0,0,.55); align-self: center; flex: 0 0 auto; view-transition-name: art; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.meta { display: flex; flex-direction: column; gap: 2.4vmin; min-width: 0; view-transition-name: meta; }
.title { font-size: clamp(20px, 4.6vmin, 48px); font-weight: 800; line-height: 1.15; letter-spacing: -.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sub { font-size: clamp(14px, 2.8vmin, 26px); color: var(--fg2); margin-top: .6vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.progress { position: relative; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.bar { position: relative; width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); transition: height .2s var(--ease); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #fff; width: 0; will-change: width; }
.knob { position: absolute; top: 50%; left: 0; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); transition: transform .2s var(--ease); will-change: left; }
.progress.drag .bar { height: 8px; }
.progress.drag .knob { transform: scale(1.5); }
.progress.drag .fill, .progress.drag .knob { background: var(--accent); }
.times { display: flex; justify-content: space-between; font-size: clamp(12px, 2vmin, 18px); color: var(--fg2); font-variant-numeric: tabular-nums; margin-top: -1.4vmin; }

.controls { display: flex; align-items: center; justify-content: space-between; }
.controls button { width: clamp(44px, 9vmin, 84px); height: clamp(44px, 9vmin, 84px); display: grid; place-items: center; border-radius: 50%; transition: transform .2s var(--ease), color .25s, background .25s; position: relative; }
.controls button:active, .controls button.press { transform: scale(.86); }
.controls svg { width: 52%; height: 52%; }
.controls .sm svg { width: 40%; height: 40%; }
.controls .sm { color: var(--fg2); }
.controls .sm.on { color: var(--accent); }
.controls .sm::after { content: ""; position: absolute; bottom: 14%; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .25s var(--ease); }
.controls .sm.on::after { transform: scale(1); }
.controls .play { background: #fff; color: #000; width: clamp(60px, 13vmin, 120px); height: clamp(60px, 13vmin, 120px); }
.controls .play svg { width: 42%; height: 42%; }

.row2 { display: flex; align-items: center; gap: 2vmin; color: var(--fg2); }
.row2 button { display: grid; place-items: center; width: clamp(40px, 7vmin, 64px); height: clamp(40px, 7vmin, 64px); border-radius: 50%; color: var(--fg2); flex: 0 0 auto; transition: color .25s, background .25s, transform .2s var(--ease); }
.row2 button svg { width: 52%; height: 52%; }
.row2 button.on { color: var(--accent); background: rgba(255,255,255,.08); }
.row2 button:active { transform: scale(.88); }
#bMute.muted { color: #ff6b6b; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 28px; background: transparent; margin: 0; transition: opacity .25s; }
input[type=range].muted { opacity: .4; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(to right, #fff var(--v, 50%), rgba(255,255,255,.18) var(--v, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border-radius: 50%; background: #fff; border: 0; }
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: #fff; }
input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 0; }

.lyrics { flex: 1 1 0; min-width: 0; min-height: 0; position: relative; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; view-transition-name: lyrics;
  -webkit-mask-image: linear-gradient(transparent 0, #000 14%, #000 82%, transparent 100%); mask-image: linear-gradient(transparent 0, #000 14%, #000 82%, transparent 100%); }
.lyrics::-webkit-scrollbar { display: none; }
.lyr-inner { padding: 38vh 0 46vh; }
.line { font-size: clamp(22px, 5vmin, 52px); font-weight: 800; line-height: 1.28; letter-spacing: -.01em; color: var(--fg3); padding: 1.2vmin 0; transform-origin: left center; transition: color .4s, transform .45s var(--ease), filter .45s; cursor: pointer; }
.line.past { color: rgba(255,255,255,.52); }
.line.active { color: #fff; transform: scale(1.035); }
.line.gap { font-size: clamp(18px, 3.6vmin, 36px); }
.lyrics.plain .line { color: rgba(255,255,255,.82); cursor: default; font-size: clamp(18px, 3.8vmin, 38px); }
.lyrics.plain .lyr-inner { padding: 14vh 0 20vh; }
.lyr-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--fg2); font-size: clamp(16px, 3.2vmin, 30px); padding: 4vmin; }
.lyr-src { font-size: 12px; color: var(--fg3); padding-top: 3vmin; }

#clock { position: fixed; top: max(2.6vmin, env(safe-area-inset-top)); right: max(3.4vmin, env(safe-area-inset-right)); font-size: clamp(13px, 2.4vmin, 22px); color: var(--fg2); font-variant-numeric: tabular-nums; font-weight: 600; pointer-events: none; }

@media (orientation: landscape) {
  body.lyr .left { width: clamp(270px, 37vw, 560px); }
  body.lyr .art { width: min(100%, 46vh); }
  body:not(.lyr) .left { flex: 1 1 auto; flex-direction: row; align-items: center; gap: 6vmin; }
  body:not(.lyr) .art { width: min(78vh, 44vw); }
  body:not(.lyr) .meta { flex: 1; gap: 3.4vmin; }
  body:not(.lyr) .title { font-size: clamp(24px, 6.4vmin, 64px); }
  body:not(.lyr) .lyrics { display: none; }
}
@media (orientation: portrait) {
  #app { flex-direction: column; }
  .left { flex: 1 1 auto; }
  .art { width: min(86vw, 50vh); }
  body:not(.lyr) .lyrics { display: none; }
  body.lyr .left { flex: 0 0 auto; order: 2; }
  body.lyr .art { display: none; }
  body.lyr .lyrics { order: 1; }
  body.lyr .title { font-size: clamp(18px, 4.4vmin, 32px); -webkit-line-clamp: 1; }
}
@media (max-height: 480px) and (orientation: landscape) {
  body.lyr .art { width: min(100%, 34vh); }
  .meta { gap: 1.4vmin; }
  .left { gap: 2.4vmin; }
  .controls button { width: 42px; height: 42px; }
  .controls .play { width: 54px; height: 54px; }
  .row2 button { width: 38px; height: 38px; }
  .progress { height: 22px; }
}

::view-transition-group(*) { animation-duration: .55s; animation-timing-function: var(--ease); }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(meta), ::view-transition-new(meta) { width: auto; height: auto; object-fit: none; object-position: left top; }
::view-transition-old(meta) { animation: vt-fade-out .2s ease both; }
::view-transition-new(meta) { animation: vt-fade-in .4s .12s ease both; }
::view-transition-new(lyrics):only-child { animation: vt-lyr-in .55s var(--ease) both; }
::view-transition-old(lyrics):only-child { animation: vt-lyr-out .3s ease both; }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
@keyframes vt-lyr-in { from { opacity: 0; transform: translateX(10%); } }
@keyframes vt-lyr-out { to { opacity: 0; transform: translateX(10%); } }

#goo { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; overflow: visible; opacity: 0; transition: opacity .25s; will-change: transform; }
#goo.on { opacity: .5; }
#goo.on.idle { opacity: 0; }
#cursor .dot { display: none !important; }
#cursor { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; will-change: transform; transform: translate3d(-100px, -100px, 0); }
#cursor .dot {
  width: 22px; height: 22px; border-radius: 11px;
  background: radial-gradient(120% 90% at 30% 22%, rgba(255,255,255,.75), rgba(215,215,220,.42) 55%, rgba(170,170,180,.38));
  border: 1px solid rgba(255,255,255,.38);
  -webkit-backdrop-filter: blur(5px) saturate(1.9) brightness(1.15); backdrop-filter: blur(5px) saturate(1.9) brightness(1.15);
  box-shadow: inset 0 1px 1.5px rgba(255,255,255,.65), inset 0 -2px 4px rgba(0,0,0,.18), 0 3px 10px rgba(0,0,0,.28);
  opacity: 0; transform: scale(.3);
  transition: opacity .2s, transform .2s var(--ease), background .25s, border-color .25s, box-shadow .25s;
}
#cursor.on .dot { opacity: 1; transform: none; }
#cursor.on.idle .dot { opacity: 0; }
#cursor.on.down .dot { transform: scale(.82); }
.dot { will-change: width, height, scale, rotate; }
#cursor.snap .dot { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.17)); border-color: rgba(255,255,255,.38);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -1px 3px rgba(0,0,0,.12); -webkit-backdrop-filter: brightness(1.12) saturate(1.3); backdrop-filter: brightness(1.12) saturate(1.3); }
#cursor.on.down.snap .dot { transform: scale(.96); }
button.hov { transform: none; }
.line.hov { transform: none; color: #fff; }

.overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vmin; text-align: center; background: #000; z-index: 5; padding: 6vmin; opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s; }
#idle { background: radial-gradient(ellipse at 50% 120%, #10301c 0%, #000 65%); }
body.idle[data-view="player"] #idle, body.offline #offline { opacity: 1; visibility: visible; transition: opacity .5s, visibility 0s; }
.big-clock { font-size: clamp(64px, 22vmin, 220px); font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.date { font-size: clamp(16px, 3.4vmin, 32px); font-weight: 600; color: var(--fg2); text-transform: capitalize; }
.hint { font-size: clamp(14px, 2.6vmin, 24px); color: var(--fg3); margin-top: 2vmin; }
.pill { margin-top: 2vmin; padding: 1.6vmin 4.4vmin; border-radius: 999px; background: #1ed760; color: #000; font-weight: 700; font-size: clamp(14px, 2.6vmin, 24px); transition: transform .2s var(--ease); }
.pill.ghost { background: rgba(255,255,255,.12); color: #fff; }
.pill:active { transform: scale(.95); }
#offline .t { font-size: clamp(20px, 4.2vmin, 40px); font-weight: 700; }
.spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.el, .np-t, .np-s, .mini-t, .mini-s, .tt, .ts, .cn, .cs, .ds, .ptitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { position: fixed; inset: 0; opacity: 0; visibility: hidden; pointer-events: none; transform: scale(.94); transition: opacity .3s ease, transform .5s var(--ease), visibility 0s .5s; }
#home.view { transform: scale(1.06); }
body[data-view="home"] #home, body[data-view="player"] #app, body[data-view="lib"] #lib, body[data-view="sys"] #sys, body[data-view="clip"] #clip, body[data-view="cal"] #cal { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .3s ease, transform .5s var(--ease), visibility 0s; }

#topbar { position: fixed; top: max(2vmin, env(safe-area-inset-top)); right: max(2.6vmin, env(safe-area-inset-right)); display: flex; align-items: center; gap: 6px; z-index: 4; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
body[data-view="player"] #topbar { opacity: 1; visibility: visible; transition: opacity .3s .12s, visibility 0s; }
.ib { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--fg2); background: rgba(255,255,255,.07); flex: 0 0 auto; transition: background .2s, color .2s, transform .2s var(--ease); }
.ib svg { width: 18px; height: 18px; }
.ib:active { transform: scale(.88); }
#clock { position: static; margin-left: 6px; }

#home { display: flex; flex-direction: column; padding: max(5vmin, env(safe-area-inset-top)) max(7vmin, env(safe-area-inset-right)) max(3.2vmin, env(safe-area-inset-bottom)) max(7vmin, env(safe-area-inset-left)); }
.hl { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 6vmin; }
.hc { min-width: 0; }
.h-clock { font-size: clamp(56px, 22vmin, 220px); font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.h-date { font-size: clamp(15px, 3.4vmin, 30px); font-weight: 600; color: var(--fg2); text-transform: capitalize; margin-top: 1.6vmin; }
.np { flex: 0 1 46%; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 22px; background: rgba(255,255,255,.09); max-width: 560px; cursor: pointer; transition: background .25s; }
.np.hov { background: rgba(255,255,255,.12); }
.np-art, .mini-art { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.08) center / cover no-repeat; flex: 0 0 auto; }
.np-art { width: clamp(52px, 15vmin, 108px); border-radius: 14px; }
.np-tx, .mini-tx { flex: 1 1 0; min-width: 0; }
.np-t { font-weight: 700; font-size: clamp(15px, 3.2vmin, 24px); }
.np-s { color: var(--fg2); font-size: clamp(13px, 2.5vmin, 18px); margin-top: 2px; }
.np button, .mini button { border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; transition: transform .2s var(--ease), background .2s; }
.np button { width: clamp(40px, 10vmin, 56px); height: clamp(40px, 10vmin, 56px); }
.np button svg { width: 46%; height: 46%; }
.np .pp, .mini .pp { background: #fff; color: #000; }
.np.empty button, .mini.empty button { display: none; }
.dockbar { align-self: center; flex: 0 0 auto; margin-bottom: 3.5vmin; display: flex; align-items: flex-end; gap: 2vmin; padding: 1.25vmin; border-radius: 3.9vmin; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); box-shadow: 0 2vmin 6vmin rgba(0,0,0,.35); }
.app { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.app span { position: absolute; bottom: calc(100% + 1.6vmin); left: 50%; transform: translate(-50%, 6px); padding: 4px 10px; border-radius: 8px; background: rgba(30,30,30,.9); font-size: 13px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); }
.app.hov span { opacity: 1; transform: translate(-50%, 0); }
.app .ic { width: clamp(44px, 12.5vmin, 80px); aspect-ratio: 1; border-radius: 24%; display: grid; place-items: center; background: rgba(255,255,255,.12); transform-origin: 50% 100%; transition: transform .3s var(--ease); }
.app .ic svg { width: 56%; height: 56%; }
.app.sp .ic { background: linear-gradient(145deg, #2ee672, #12a84a); color: #000; }
.app.yt .ic { background: linear-gradient(145deg, #ff4e45, #d4001a); color: #fff; }
.app.am .ic { background: linear-gradient(145deg, #ff6b81, #fa233b); color: #fff; }
.app.hov .ic { transform: scale(1.14) translateY(-4%); }
.app:active .ic, .app.press .ic { transform: scale(.92); }
.app::after { content: ""; position: absolute; bottom: -1vmin; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255,255,255,.8); opacity: 0; transition: opacity .3s; }
.app.running::after { opacity: 1; }
.tap.press.app { background: none; }

#lib { display: flex; gap: 2.6vmin; padding: max(3vmin, env(safe-area-inset-top)) max(3vmin, env(safe-area-inset-right)) max(3vmin, env(safe-area-inset-bottom)) max(3vmin, env(safe-area-inset-left)); }
.side { flex: 0 0 clamp(150px, 21vw, 250px); display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.side-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
html, body { touch-action: none; }
.nv { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: clamp(36px, 9.4vmin, 52px); border-radius: 12px; color: var(--fg2); font-weight: 600; font-size: clamp(13px, 2.7vmin, 17px); text-align: left; flex: 0 0 auto; transition: background .2s, color .2s, transform .2s var(--ease); }
.nv svg { width: 20px; height: 20px; flex: 0 0 auto; }
.nv.on { background: rgba(255,255,255,.13); color: #fff; }
.nv.hov { background: rgba(255,255,255,.08); color: #fff; transform: none; }
.nv.on.hov { background: rgba(255,255,255,.16); }
.side .gap { flex: 1 1 auto; min-height: 8px; }
.mini { display: flex; align-items: center; gap: 9px; padding: 7px; border-radius: 14px; background: rgba(255,255,255,.09); cursor: pointer; transition: background .2s; flex: 0 0 auto; }
.mini.hov { background: rgba(255,255,255,.15); }
.mini-art { width: 40px; border-radius: 8px; }
.mini-t { font-size: 13px; font-weight: 700; }
.mini-s { font-size: 12px; color: var(--fg2); }
.mini button { width: 34px; height: 34px; }
.mini button svg { width: 15px; height: 15px; }
.pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: rgba(0,0,0,.3); border-radius: 18px; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; flex: 0 0 auto; min-height: 56px; }
#pBack { visibility: hidden; }
.ptitle { font-size: clamp(18px, 4.2vmin, 28px); font-weight: 800; min-width: 0; }
.sbox { flex: 1 1 auto; display: none; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.1); cursor: text; transition: background .2s, box-shadow .2s; min-width: 0; }
.sbox svg { width: 18px; height: 18px; color: var(--fg2); flex: 0 0 auto; }
.sbox.hov { background: rgba(255,255,255,.15); }
.sbox.focus { box-shadow: inset 0 0 0 2px var(--accent); background: rgba(255,255,255,.14); }
#lib.searching .sbox { display: flex; }
#lib.searching .ptitle { display: none; }
.q { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 15px; -webkit-appearance: none; appearance: none; }
.q::placeholder { color: var(--fg3); }
.q::-webkit-search-cancel-button { display: none; }
#qClear { width: 26px; height: 26px; background: none; display: none; }
.sbox.filled #qClear { display: grid; }
.chips { display: none; gap: 8px; padding: 0 14px 8px; flex: 0 0 auto; overflow: hidden; }
#lib.searching.has .chips { display: flex; }
.chip { height: 30px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 13px; font-weight: 600; flex: 0 0 auto; transition: background .2s, color .2s, transform .2s var(--ease); }
.chip.on { background: #fff; color: #000; }
.pbody { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 10px 28px; scrollbar-width: none; }
.pbody::-webkit-scrollbar { display: none; }
.sec { margin: 4px 0 14px; }
.sh { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 17px; margin: 6px 6px 6px; }
.lnk { font-size: 13px; color: var(--fg2); font-weight: 600; padding: 4px 10px; border-radius: 8px; }
.trk { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 10px; cursor: pointer; transition: background .15s; }
.trk .th { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,.08); flex: 0 0 auto; display: block; }
.trk .num { width: 28px; text-align: center; color: var(--fg3); font-variant-numeric: tabular-nums; flex: 0 0 auto; font-size: 14px; }
.trk .tx { flex: 1 1 0; min-width: 0; }
.tt { font-size: 15px; font-weight: 600; }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PLAY = 'M7 4.6v14.8a1 1 0 0 0 1.52.85l12.1-7.4a1 1 0 0 0 0-1.7L8.52 3.75A1 1 0 0 0 7 4.6z';
  const PAUSE = 'M6 4.5A1.5 1.5 0 0 1 7.5 3h2A1.5 1.5 0 0 1 11 4.5v15A1.5 1.5 0 0 1 9.5 21h-2A1.5 1.5 0 0 1 6 19.5zM13 4.5A1.5 1.5 0 0 1 14.5 3h2A1.5 1.5 0 0 1 18 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-2a1.5 1.5 0 0 1-1.5-1.5z';
  const VOL_ON = 'M11 5 6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14';
  const VOL_OFF = 'M11 5 6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6';
  const LEAD_MS = 250;
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  const canAnimate = !!Element.prototype.animate;

  let SRC = 'spotify';
  const STATES = { spotify: null, ytm: null, am: null };
  const APP = { spotify: 'Spotify', ytm: 'YouTube Music', am: 'Apple Music' };
  const APP_ICON = { spotify: 'appSpotify', ytm: 'appYtm', am: 'appAm' };
  const withSrc = (params, src) => { const q = new URLSearchParams(params); const x = src || SRC; if (x !== 'spotify') q.set('src', x); return q; };
  let st = null, recvAt = 0, curId = null, curArt = null, artToken = 0, bgFlip = false;
  let lyr = null, activeIdx = -2, userScrollAt = 0;
  let dragging = false, dragFrac = 0, volBusyUntil = 0, playLockUntil = 0, seekLockUntil = 0;
  let navDir = 0, navAt = 0, webVersion = '';
  let fails = 0, inflight = false, pollTimer = null, sseOpen = false;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let lyrPref = store.get('lyr', '1') !== '0';
  if (!lyrPref) document.body.classList.remove('lyr');
  $('bLyr').classList.toggle('on', document.body.classList.contains('lyr'));
  if (window.DockApp) $('bRediscover').style.display = '';

  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const anim = (el, frames, opts) => canAnimate ? el.animate(frames, opts) : null;

  function curPos() {
    if (!st) return 0;
    let p = st.positionMs;
    if (st.playing) p += performance.now() - recvAt;
    return clamp(p, 0, st.durationMs || p);
  }

  function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  async function poll() {
    if (inflight) return;
    inflight = true;
    try {
      const src = SRC;
      const r = await fetch('/api/state?' + withSrc({}, src), { cache: 'no-store' });
      ingest(src, await r.json());
      fails = 0;
      document.body.classList.remove('offline');
    } catch {
      if (++fails >= 3) { document.body.classList.add('offline'); pointerLeaveLocal(); }
    } finally {
      inflight = false;
      schedule(document.hidden ? 4000 : sseOpen ? 2000 : 1000);
    }
  }

  let es = null, esLastAt = 0;
  function connectEvents() {
    if (!window.EventSource) return;
    if (es) es.close();
    es = new EventSource('/api/events');
    esLastAt = performance.now();
    es.onopen = () => { sseOpen = true; esLastAt = performance.now(); };
    es.onerror = () => { sseOpen = false; };
    es.addEventListener('state', e => {
      esLastAt = performance.now();
      try { ingest('spotify', JSON.parse(e.data)); fails = 0; document.body.classList.remove('offline'); } catch {}
    });
    es.addEventListener('ytstate', e => {
      esLastAt = performance.now();
      try { ingest('ytm', JSON.parse(e.data)); } catch {}
    });
    es.addEventListener('calendar', () => { esLastAt = performance.now(); loadCalendar(true); });
    es.addEventListener('clip', e => { esLastAt = performance.now(); try { onClip(JSON.parse(e.data)); } catch {} });
    es.addEventListener('battery', e => { esLastAt = performance.now(); try { applyBattery(JSON.parse(e.data)); } catch {} });
    es.addEventListener('notify', e => { esLastAt = performance.now(); try { showNotif(JSON.parse(e.data)); } catch {} });
    es.addEventListener('amstate', e => {
      esLastAt = performance.now();
      try { ingest('am', JSON.parse(e.data)); } catch {}
    });
    es.addEventListener('pointer', e => { esLastAt = performance.now(); try { pointerEvent(JSON.parse(e.data)); } catch {} });
  }
  setInterval(() => {
    if (!window.EventSource || document.hidden) return;
    if (!es || es.readyState === EventSource.CLOSED || performance.now() - esLastAt > 6000) connectEvents();
  }, 2000);

  function ingest(src, s) {
    if (!s) return;
    STATES[src] = s;
    $(APP_ICON[src]).classList.toggle('running', !!s.running);
    if (src === SRC) apply(s);
    updateHome();
  }

  function apply(s) {
    const now = performance.now();
    const prev = st;
    if (prev && prev.hasTrack && s.hasTrack && s.id === prev.id) {
      const local = curPos();
      if (now < playLockUntil && s.playing !== prev.playing) s.playing = prev.playing;
      if (now < seekLockUntil) {
        if (Math.abs(s.positionMs - local) < 1500) seekLockUntil = 0;
        else s.positionMs = local;
      } else if (s.playing && prev.playing && Math.abs(s.positionMs - local) < 1000) {
        s.positionMs = local;
      }
    }
    st = s; recvAt = now;
    if (s.web) {
      if (!webVersion) webVersion = s.web;
      else if (s.web !== webVersion && !RP.on) { location.reload(); return; }
    }
    const idle = !s.running || !s.hasTrack;
    document.body.classList.toggle('idle', idle);
    updateMini(s);
    if (s.id !== markedId) markNow();
    applyVolume(s);
    if (idle) {
      $('idleMsg').textContent = s.running ? 'В ' + APP[SRC] + ' сейчас ничего не играет' : APP[SRC] + ' не запущен';
      $('bOpen').textContent = SRC === 'ytm' ? 'Открыть YouTube Music' : SRC === 'am' ? 'Открыть «Музыку» на Mac' : s.running ? 'Показать Spotify на Mac' : 'Открыть Spotify на Mac';
      $('bOpen').style.display = SRC !== 'spotify' && s.running ? 'none' : '';
      $('bIdleLib').style.display = SRC === 'ytm' && !s.running ? 'none' : '';

    const cur = timed.find(e => e.start <= now);
    const next = timed.find(e => e.start > now);
    let ev = cur || next, when = '';
    if (cur) when = 'Идёт · до ' + hm(cur.end);
    else if (next) {
      const d = new Date(next.start * 1000);
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);

    const has = new Set(CAL.events.map(e => dayKey(new Date(e.start * 1000))));
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const offset = (first.getDay() + 6) % 7;

    for (let i = 0; i < 42; i++) {

  }
  setInterval(() => { if (view === 'clip') for (const el of document.querySelectorAll('.clip-meta .ago')) el.textContent = agoText(+el.dataset.t); }, 30000);
  async function loadBattery() {
    try { applyBattery(await (await fetch('/api/system', { cache: 'no-store' })).json()); } catch {}
  }
  function applyBattery(d) {
    {
      const el = $('homeBatt');
      if (d.battery < 0) { el.classList.remove('on'); return; }
      el.classList.add('on');
      el.classList.toggle('plugged', !!(d.plugged || d.charging));
      el.classList.toggle('low', !(d.plugged || d.charging) && d.battery <= 20);
      const gap = d.battery >= 100 ? 0 : Math.max(10, 115.61 * (1 - d.battery / 100));
      $('hbFg').style.strokeDashoffset = gap.toFixed(1);
      $('hbPct').textContent = d.battery;
    }
  }
  loadBattery();
  setInterval(() => { if (!document.hidden) loadBattery(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadBattery(); });
  $('sysPlayer').onclick = () => { setSrc(homeSrc()); go('player'); };
  $('sysHome').onclick = () => go('home');

  function setSrc(src) {
    if (src === SRC) return;
    SRC = src;
    store.set('src', src);
    document.body.dataset.src = src;
    st = null; curId = null; curArt = null; lyr = null; activeIdx = -2;
    $('lyrInner').textContent = '';
    lyrMsg('');
    $('title').textContent = ''; $('sub').textContent = '';
    for (const img of [...$('artBox').querySelectorAll('img')]) img.remove();
    miniArtUrl = null;
    LIB.stack = []; LIB.roots = {}; LIB.q = ''; LIB.liked = ''; LIB.filter = 'all';
    $('q').value = '';
    $('sbox').classList.remove('filled');
    document.body.classList.add('idle');
    $('idleMsg').textContent = '';
    $('bOpen').style.display = 'none';
    if (STATES[src]) apply(STATES[src]);
    if (view === 'lib') setTab(LIB.tab);
    fetch('/api/state?' + withSrc({}, src), { cache: 'no-store' }).then(r => r.json()).then(d => ingest(src, d)).catch(() => {});
  }
  for (const a of document.querySelectorAll('.app[data-go]')) a.onclick = () => { setSrc(a.dataset.src || 'spotify'); const g = a.dataset.go; if (g === 'player') go('player'); else libOpen(g); };
  $('pBack').onclick = () => libPop();
  $('libHome').onclick = () => go('home');
  $('tbHome').onclick = () => go('home');
  $('tbSearch').onclick = () => libOpen('search');
  $('tbLib').onclick = () => libOpen('library');
  $('bIdleLib').onclick = () => libOpen('library');
  $('bIdleHome').onclick = () => go('home');
  $('mini').onclick = () => go('player');
  $('miniPlay').onclick = e => { e.stopPropagation(); togglePlay(); };
  $('np').onclick = () => {
    const src = homeSrc();
    setSrc(src);
    const ss = STATES[src];
    if (ss && ss.running && ss.hasTrack) go('player');
    else if (ss && ss.running) libOpen('library');
    else { cmd('open'); go('player'); }
  };
  const npCmd = c => { if (c !== 'playpause') { npNavDir = c === 'next' ? 1 : -1; npNavAt = performance.now(); } const src = homeSrc(); if (src === SRC) { if (c === 'playpause') togglePlay(); else { navDir = c === 'next' ? 1 : -1; navAt = performance.now(); cmd(c); } } else cmd(c, null, src); };
  $('npPlay').onclick = e => { e.stopPropagation(); npCmd('playpause'); };
  $('npNext').onclick = e => { e.stopPropagation(); npCmd('next'); };
  $('npPrev').onclick = e => { e.stopPropagation(); npCmd('prev'); };
  $('sbox').onclick = e => { if (e.target.closest('#qClear')) return; $('q').focus(); };
  $('qClear').onclick = e => { e.stopPropagation(); $('q').value = ''; runSearch(true); $('q').focus(); };
  $('q').addEventListener('input', () => runSearch(false));
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { runSearch(true); $('q').blur(); } });
  $('q').addEventListener('focus', () => { $('sbox').classList.add('focus'); syncKb(); });
  $('q').addEventListener('blur', () => { $('sbox').classList.remove('focus'); syncKb(); });

  let kbOn = false;
  function kbWanted() { return RP.on && document.activeElement === $('q') && view === 'lib'; }
  function syncKb() {
    const want = kbWanted();
    if (want === kbOn) return;
    kbOn = want;
    fetch('/api/pointer?t=kb&on=' + (want ? 1 : 0), { method: 'POST', keepalive: true }).catch(() => {});
  }

  function remoteKey(m) {
    const a = $('q');
    if (document.activeElement !== a) return;
    const k = m.k;
    if (k === 51) a.value = a.value.slice(0, -1);
    else if (k === 36 || k === 76) { runSearch(true); return; }
    else if (k === 53) { a.blur(); return; }
    else if (k >= 115 && k <= 126) return;
    else if (m.s && !/[\u0000-\u001f\u007f-]/.test(m.s)) a.value += m.s;
    else return;
    runSearch(false);
  }

  const SC = { el: null, target: 0, at: 0, raf: 0 };
  function smoothScroll(el, dy) {
    const now = performance.now();
    if (SC.el !== el || now - SC.at > 250) { SC.el = el; SC.target = el.scrollTop; }
    SC.at = now;
    SC.target = clamp(SC.target + dy, 0, Math.max(0, el.scrollHeight - el.clientHeight));
    if (!SC.raf) SC.raf = raf(stepScroll);
  }
  function stepScroll() {
    SC.raf = 0;
    const el = SC.el;
    if (!el) return;
    const d = SC.target - el.scrollTop;
    if (Math.abs(d) < 0.6) { el.scrollTop = SC.target; requestRender(); return; }
    el.scrollTop += d * 0.3;
    requestRender();
    SC.raf = raf(stepScroll);
  }

  function scrollerAt(x, y) {
    let el = document.elementFromPoint(x, y);
    while (el && el !== document.body && el !== document.documentElement) {
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      el = el.parentElement;
    }
    const L = $('lyrics');
    return view === 'player' && getComputedStyle(L).display !== 'none' ? L : null;
  }

  const WX_DESC = c => c === 0 ? 'Ясно' : c === 1 ? 'Малооблачно' : c === 2 ? 'Переменная облачность' : c === 3 ? 'Пасмурно'
    : c === 45 || c === 48 ? 'Туман' : c >= 51 && c <= 57 ? 'Морось' : c >= 61 && c <= 67 ? 'Дождь' : c >= 71 && c <= 77 ? 'Снег'
    : c >= 80 && c <= 82 ? 'Ливень' : c === 85 || c === 86 ? 'Снегопад' : c >= 95 ? 'Гроза' : '';
  const WX_SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>';
  const WX_MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
  const WX_CLOUD = '<path d="M7 18.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.8 9.6 4.5 4.5 0 0 0 7 18.5z"/>';
  function wxIcon(c, day) {
    let inner;
    if (c === 0) inner = day ? WX_SUN : WX_MOON;
    else if (c <= 2) inner = (day ? '<g transform="translate(-3 -4) scale(.75)">' + WX_SUN + '</g>' : '<g transform="translate(-2 -3) scale(.7)">' + WX_MOON + '</g>') + '<path d="M9 20h8.5a3.5 3.5 0 0 0 .3-7 4.8 4.8 0 0 0-9.1-.8A3.9 3.9 0 0 0 9 20z" fill="rgba(0,0,0,.35)"/>';
    else if (c === 3) inner = WX_CLOUD;
    else if (c === 45 || c === 48) inner = '<path d="M4 9h16M3 13h18M5 17h14"/>';
    else if ((c >= 71 && c <= 77) || c === 85 || c === 86) inner = '<path d="M7 15.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.8 6.6 4.5 4.5 0 0 0 7 15.5z"/><path d="M8 19h.01M12 20.5h.01M16 19h.01"/>';
    else if (c >= 95) inner = WX_CLOUD + '<path d="m12.5 13-2 4h3l-2 4"/>';
    else inner = '<path d="M7 15.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.8 6.6 4.5 4.5 0 0 0 7 15.5z"/><path d="m8 18-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  async function loadWeather() {
    try {
      const w = await (await fetch('/api/weather', { cache: 'no-store' })).json();
      if (!w || !w.ok) return;
      const deg = n => (n > 0 ? '' : n < 0 ? '−' : '') + Math.abs(n) + '°';
      $('hWeather').innerHTML = '<span class="wx-ic">' + wxIcon(w.code, w.isDay) + '</span><span class="wx-t">' + deg(w.temp) + '</span><span>' + esc(WX_DESC(w.code)) + '</span><span class="wx-r">↑' + deg(w.max) + ' ↓' + deg(w.min) + ' · ' + esc(w.city) + '</span>';
      $('hWeather').classList.add('on');
    } catch {}
  }
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);

  function tickHome(d, t) {
    $('hClock').textContent = t;
    $('hDate').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  {
    SRC = APP[store.get('src', 'spotify')] ? store.get('src', 'spotify') : 'spotify';
    document.body.dataset.src = SRC;
    const v0 = store.get('view', 'home');
    LIB.tab = TITLES[store.get('libTab', 'search')] ? store.get('libTab', 'search') : 'search';
    if (v0 === 'lib') { view = 'player'; libOpen(LIB.tab); }
    else if (v0 === 'player') { view = 'player'; document.body.dataset.view = 'player'; }
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  window.addEventListener('resize', () => setTimeout(() => scrollToActive('auto'), 50));

  tickClock();
  setInterval(frame, 100);
  if (window.requestAnimationFrame) { const loop = () => { frame(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  connectEvents();
  poll();
})();
</script>
</body>
</html>
