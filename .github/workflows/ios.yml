name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'web/**', '.github/workflows/ios.yml']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project SpotifyDock.xcodeproj -scheme SpotifyDock \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build | tail -40
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SpotifyDock.app Payload/
          zip -qr SpotifyDock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyDock-ios-unsigned
          path: ios/SpotifyDock.ipa
