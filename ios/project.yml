name: SpotifyDock
options:
  bundleIdPrefix: app.spotifydock
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpotifyDock:
    type: application
    platform: iOS
    sources: [SpotifyDock]
    info:
      path: SpotifyDock/Info.plist
      properties:
        CFBundleDisplayName: Spotify Dock
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "Spotify Dock ищет Mac в вашей Wi‑Fi сети, чтобы показывать текущий трек."
        NSBonjourServices: ["_spotifydock._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spotifydock.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
